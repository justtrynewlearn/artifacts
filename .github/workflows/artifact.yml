name: Performance Artifact Practice

on:
  push:
    branches:
      - master

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Run performance test
        run: |
          mkdir -p results/html-report

          echo "time,response_time,status" > results/results.jtl
          echo "10:00:01,120,200" >> results/results.jtl
          echo "10:00:02,150,200" >> results/results.jtl
          echo "10:00:03,95,200" >> results/results.jtl

          echo "JMeter test completed successfully" > results/jmeter.log

          echo "<html>" > results/html-report/index.html
          echo "<body>" >> results/html-report/index.html
          echo "<h1>Performance Test Report</h1>" >> results/html-report/index.html
          echo "<p>Requests: 3</p>" >> results/html-report/index.html
          echo "<p>Average response time: 121.7 ms</p>" >> results/html-report/index.html
          echo "</body>" >> results/html-report/index.html
          echo "</html>" >> results/html-report/index.html

      - name: Show generated results
        run: |
          echo "Generated files:"
          find results -type f

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: results/

  report:
    needs: performance-test
    runs-on: ubuntu-latest

    steps:
      - name: Download performance results
        uses: actions/download-artifact@v5
        with:
          name: performance-results

      - name: Show downloaded results
        run: |
          echo "Downloaded files:"
          find . -type f

      - name: Read JMeter log
        run: |
          echo "JMeter log:"
          cat jmeter.log

      - name: Read test results
        run: |
          echo "JTL:"
          cat results.jtl

      - name: Read HTML report
        run: |
          echo "HTML report:"
          cat html-report/index.html
