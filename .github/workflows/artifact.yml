name: Artifact Practice

on:
  push:
    branches:
      - master

jobs:
  upload-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Create result files
        run: |
          mkdir results
          echo "Performance test completed" > results/result.txt
          echo "Requests=1000" > results/metrics.csv
          echo "<html><body>Performance Report</body></html>" > results/report.html

      - name: Upload results directory
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: results/
